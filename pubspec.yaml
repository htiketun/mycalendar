name: arcade_calendar
description: A futuristic calendar app with arcade theme and advanced event management.
publish_to: 'none'
version: 1.0.0+1

environment:
    sdk: '>=3.0.0 <4.0.0'

dependencies:
    flutter:
        sdk: flutter
    cupertino_icons: ^1.0.2
    shared_preferences: ^2.2.2
    intl: ^0.18.1
    google_fonts: ^6.1.0
    flutter_local_notifications: ^17.2.2
    timezone: ^0.9.4

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^3.0.0
    flutter_launcher_icons: ^0.13.1

flutter:
    uses-material-design: true

flutter_launcher_icons:
    android: 'launcher_icon'
    ios: true
    image_path: 'assets/icon/icon.png'
    min_sdk_android: 21
    web:
        generate: true
        image_path: 'assets/icon/icon.png'
        background_color: '#2D1B69'
        theme_color: '#9D4EDD'
    windows:
        generate: true
        image_path: 'assets/icon/icon.png'
        icon_size: 48
    macos:
        generate: true
        image_path: 'assets/icon/icon.png'
